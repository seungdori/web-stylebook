name: mcp-ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  site-and-catalog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Site gates
        run: |
          npm run typecheck
          npm run lint
          npm run i18n:check
      - name: Generate canonical MCP catalog
        run: npm run mcp:catalog
      - name: Catalog drift + validate
        run: |
          npm run mcp:catalog:check
          npm run mcp:catalog:validate
      - name: Root catalog integrity tests
        run: npm run test
      - name: Site build
        run: npm run build
      - name: Site resource and selected-handoff budgets
        if: matrix.node == 20
        run: npx tsx scripts/quality-measure.mts --check --scope site --output /tmp/site-quality.json
      - name: Install browser smoke runtime
        if: matrix.node == 20
        run: npx --yes agent-browser@0.38.1 install --with-deps
      - name: Browser workflow smoke
        if: matrix.node == 20
        run: npm run quality:browser
      - name: Upload browser smoke evidence
        if: always() && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.sha }}
          path: output/playwright/webstylebook-fidelity/browser-smoke
          if-no-files-found: warn
      - name: Upload resource measurement
        if: always() && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-${{ github.sha }}
          path: /tmp/site-quality.json
          if-no-files-found: warn
      - name: Upload canonical MCP catalog
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mcp-catalog-${{ github.sha }}
          path: packages/mcp/generated
          if-no-files-found: error
